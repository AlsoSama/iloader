name: Promote existing Watch Companion prerelease
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/promote-existing-watch-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Convert existing prerelease to normal release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="watch-companion-exp-2026-11-11"
          gh release view "$TAG" --repo "$GH_REPO" >/dev/null
          gh release edit "$TAG" --repo "$GH_REPO" --prerelease=false --latest \
            --title "Windows Apple Watch Companion (Unofficial Community Build, 2026-11-11)"
          gh release view "$TAG" --repo "$GH_REPO" --json tagName,name,isPrerelease,assets
